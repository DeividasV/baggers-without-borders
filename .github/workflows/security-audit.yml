name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

# Both jobs only read the repository. Declaring that explicitly keeps the
# GITHUB_TOKEN at the least privilege the workflow needs even if the repository
# or organisation default is later changed to read-write.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Scan for committed credentials
        # Tier 1 (pattern) always runs. Tier 2 (live .env cross-reference) is
        # skipped automatically because no .env files exist in CI.
        run: node scripts/security/scan-secrets.js

  audit-application:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Reject high and critical dependency advisories
        # Moderate findings remain visible in the log while high/critical
        # findings fail the workflow and block protected-branch merges.
        run: npm audit --audit-level=high

      - name: Check for outdated packages
        run: npm outdated || true
        continue-on-error: true
