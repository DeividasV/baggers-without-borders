services:
  bwb-climbing:
    build:
      context: .
      dockerfile: Dockerfile
    image: bwb-climbing:latest
    container_name: bwb-climbing
    restart: unless-stopped
    ports:
      - "1345:1345"
    volumes:
      # Database - SQLite file stored outside container
      - /srv/bwb/data:/app/data
      # Uploads - user uploaded files (change-requests, consent-types, documents, user-consents)
      - /srv/bwb/uploads:/app/uploads
      # Backups - database and uploads backups
      - /srv/bwb/backups:/app/backups
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=1345
      - DATABASE_URL=file:/app/data/bwb.db
      - UPLOADS_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:1345/api/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
